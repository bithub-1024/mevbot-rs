[package]
name    = "mevbot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mevbot"
path = "src/main.rs"

[dependencies]
# Solana
solana-sdk = "2.1"

# Async
tokio        = { version = "1", features = ["full"] }
futures-util = "0.3"

# HTTP
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Crypto / encoding
bs58    = "0.5"
base64  = "0.22"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utils
anyhow      = "1"
dotenv      = "0.15"
rand        = "0.8"
bincode     = "1"
parking_lot = "0.12"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
